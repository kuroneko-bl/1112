<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в систему - Выставочный центр</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth-container">
        <div class="card" style="margin: 0;">
            <div class="card-header" style="text-align: center;">
                Технопарк
            </div>
            <h2 style="text-align: center; margin-bottom: 20px;">Вход в систему</h2>
            
            <div id="errorMsg" class="alert alert-error" style="display: none;"></div>
            <div id="successMsg" class="alert alert-success" style="display: none;"></div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label>Логин</label>
                    <input type="text" id="username" name="username" required autocomplete="off">
                </div>
                <div class="form-group">
                    <label>Пароль</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Войти</button>
            </form>
            
            <div style="text-align: center; margin-top: 20px;">
                <hr>
                <a href="index.html" style="color: #667eea;">На главную</a>
                <span style="margin: 0 10px">|</span>
                <a href="#" id="showRegisterBtn" style="color: #667eea;">Регистрация</a>
            </div>
        </div>
    </div>

    <!-- Модальное окно регистрации -->
    <div id="registerModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:1000;">
        <div style="max-width:400px; margin:100px auto; background:white; border-radius:10px; padding:20px;">
            <h3 style="margin-bottom:20px;">Регистрация</h3>
            <form id="registerForm">
                <div class="form-group">
                    <label>Логин</label>
                    <input type="text" id="regUsername" required>
                </div>
                <div class="form-group">
                    <label>Пароль</label>
                    <input type="password" id="regPassword" required>
                </div>
                <div class="form-group">
                    <label>ФИО</label>
                    <input type="text" id="regFullName" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="regEmail">
                </div>
                <div class="form-group">
                    <label>Телефон</label>
                    <input type="tel" id="regPhone">
                </div>
                <button type="submit" class="btn btn-primary">Зарегистрироваться</button>
                <button type="button" class="btn btn-secondary" onclick="closeRegisterModal()">Отмена</button>
            </form>
            <div id="regMsg" style="margin-top:10px;"></div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:5000/api';
        
        // Функция для показа сообщений
        function showError(msg) {
            const errorDiv = document.getElementById('errorMsg');
            errorDiv.innerHTML = msg;
            errorDiv.style.display = 'block';
            setTimeout(() => errorDiv.style.display = 'none', 5000);
        }
        
        function showSuccess(msg) {
            const successDiv = document.getElementById('successMsg');
            successDiv.innerHTML = msg;
            successDiv.style.display = 'block';
            setTimeout(() => successDiv.style.display = 'none', 5000);
        }
        
        // Обработка входа
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            console.log('Форма отправлена');
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            console.log('Отправка запроса:', { username, password });
            
            try {
                const response = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });
                
                console.log('Статус ответа:', response.status);
                const data = await response.json();
                console.log('Ответ сервера:', data);
                
                if (response.ok) {
                    // Сохраняем токен и данные пользователя
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    showSuccess('Вход выполнен! Перенаправление...');
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1000);
                } else {
                    showError(data.error || 'Ошибка входа');
                }
            } catch (error) {
                console.error('Ошибка:', error);
                showError('Не удалось соединиться с сервером. Убедитесь, что сервер запущен на http://localhost:3000');
            }
        });
        
        // Регистрация
        document.getElementById('showRegisterBtn').addEventListener('click', function(e) {
            e.preventDefault();
            document.getElementById('registerModal').style.display = 'block';
        });
        
        window.closeRegisterModal = function() {
            document.getElementById('registerModal').style.display = 'none';
        };
        
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const userData = {
                username: document.getElementById('regUsername').value,
                password: document.getElementById('regPassword').value,
                fullName: document.getElementById('regFullName').value,
                email: document.getElementById('regEmail').value,
                phone: document.getElementById('regPhone').value,
                role: 'user'
            };
            
            try {
                const response = await fetch(`${API_URL}/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(userData)
                });
                
                const data = await response.json();
                if (response.ok) {
                    document.getElementById('regMsg').innerHTML = '<div class="alert alert-success">Регистрация успешна! Теперь можно войти.</div>';
                    setTimeout(() => {
                        closeRegisterModal();
                        document.getElementById('regMsg').innerHTML = '';
                    }, 2000);
                } else {
                    document.getElementById('regMsg').innerHTML = `<div class="alert alert-error">${data.error}</div>`;
                }
            } catch (error) {
                document.getElementById('regMsg').innerHTML = '<div class="alert alert-error">Ошибка соединения с сервером</div>';
            }
        });
        
        // Проверка, авторизован ли пользователь
        const token = localStorage.getItem('token');
        if (token && window.location.pathname.includes('login.html')) {
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
